name: Tutor checks
on:
  push:
    branches: [codex/ai-video-website]
    paths: ['services/tutor/**', 'apps/**', '.github/workflows/tutor-check.yml', 'compose.tutor.yml', '.dockerignore']
  pull_request:
    paths: ['services/tutor/**', 'apps/**', '.github/workflows/tutor-check.yml', 'compose.tutor.yml', '.dockerignore']
permissions:
  contents: read
concurrency:
  group: tutor-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Backend behavior and quota checks
        run: npm test --prefix services/tutor
      - name: Install offline video verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-noto-cjk
          npm install --prefix services/tutor --ignore-scripts --no-audit --no-fund
          cd services/tutor
          npx playwright install --with-deps chromium
      - name: Generate and play a narrated sample without paid APIs
        run: node --disable-warning=ExperimentalWarning services/tutor/scripts/smoke.mjs
